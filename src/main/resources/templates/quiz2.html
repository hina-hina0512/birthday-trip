<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お誕生日クイズ2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-color: #fafaf8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .label {
            font-family: 'EB Garamond', serif;
            font-size: 0.75em;
            letter-spacing: 0.2em;
            color: #b8a488;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.3em;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        a {
            text-decoration: none;
        }

        .card {
            display: block;
            border: 1px solid #e0dcd4;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #2c2c2c;
        }

        .card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }

        .card span {
            font-family: 'HGS教科書体' ;
            display: block;
            padding: 10px;
            font-size: 1.0em;
            color: #333;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="label">Quiz.2</div>
    <h1>岐阜県と長野県にまたがる<br>自然がきれいな観光地はどこでしょう</h1>

    <div class="choices">
        <a th:href="@{/trivia2(q1=${param.q1}, q2='kamikochi')}">
            <div class="card">
                <img src="/images/kamikochi.jpg" alt="上高地">
                <span>上高地</span>
            </div>
        </a>
        <a th:href="@{/trivia2(q1=${param.q1}, q2='karuizawa')}">
            <div class="card">
                <img src="/images/karuizawa.jpg" alt="軽井沢">
                <span>軽井沢</span>
            </div>
        </a>
        <a th:href="@{/trivia2(q1=${param.q1}, q2='fuji')}">
            <div class="card">
                <img src="/images/fuji.jpg" alt="富士五湖">
                <span>富士五湖</span>
            </div>
        </a>
        <a th:href="@{/trivia2(q1=${param.q1}, q2='tateyama')}">
            <div class="card">
                <img src="/images/tateyama.jpg" alt="立山黒部">
                <span>立山黒部</span>
            </div>
        </a>
    </div>
</body>
</html>
