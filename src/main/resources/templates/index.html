<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Trip</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-image: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.45)), url('/images/出発の画像.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 60px 40px;
            max-width: 420px;
        }

        .label {
            font-family: 'Century','Noto Serif JP' ;
            font-size: 1.5em;
            letter-spacing: 0.2em;
            color: #f5e6c8;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.8em;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
        }

        p {
            font-family: 'Noto Serif JP', serif;
            font-size: 0.95em;
            color: #e8e8e8;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        a {
            text-decoration: none;
        }

        button {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 0.9em;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 16px 48px;
            background-color: #2c2c2c;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="label">さなちゃん<br>Happy Birthday</div>
    <h1>旅のはじまり</h1>
    <p>誕生日旅行の行き先を当ててみてね</p>
    <a href="/quiz"><button>START</button></a>
</div>
</body>
</html>
