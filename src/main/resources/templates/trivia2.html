<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆知識</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-color: #fafaf8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            text-align: center;
            max-width: 560px;
        }

        .label {
            font-family: 'EB Garamond', serif;
            font-size: 0.9em;
            letter-spacing: 0.2em;
            color: #b8a488;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .trivia-box {
            background-color: #fff;
            border: 1px solid #e0dcd4;
            padding: 32px 24px;
            margin-bottom: 32px;
        }

        .trivia-box p {
            font-family: 'HGS教科書体' ;
            font-size: 0.95em;
            color: #444;
            line-height: 2;
        }

        .trivia-box strong {
            font-weight: 700;
            color: #b8895e;
        }

        a {
            text-decoration: none;
        }

        button {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-weight: 500;
            font-size: 0.85em;
            letter-spacing: 0.1em;
            padding: 14px 40px;
            background-color: #2c2c2c;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="label">豆知識🫘</div>
    <div class="trivia-box">
        <p>正解は<strong>「上高地」</strong>です！<br>上高地の玄関口として知られる<strong>「河童橋」</strong>は、実は現在で5代目なんです。標高<strong>約1,500m</strong>に広がるこの神秘的な景勝地は、大正時代の焼岳の噴火によって梓川がせき止められてできたと言われています。</p>
    </div>
    <a th:href="@{/quiz3(q1=${param.q1}, q2=${param.q2})}"><button>次へ</button></a>
</div>
</body>
</html>
