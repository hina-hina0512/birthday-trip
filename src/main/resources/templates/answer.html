<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結果発表</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-color: #fafaf8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            text-align: center;
            max-width: 460px;
        }

        .label {
            font-family: 'EB Garamond', serif;
            font-size: 0.75em;
            letter-spacing: 0.2em;
            color: #b8a488;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.6em;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        p {
            font-family: 'Noto Serif JP', serif;
            font-size: 0.95em;
            color: #666;
            line-height: 1.8;
            margin-bottom: 36px;
        }

        a {
            text-decoration: none;
        }

        button {
            font-family: 'Noto Serif JP', serif;
            font-weight: 500;
            font-size: 0.85em;
            letter-spacing: 0.1em;
            padding: 16px 44px;
            background-color: #2c2c2c;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
<div class="container">
    <div th:if="${isCorrect}">
        <div class="label">Congratulations</div>
        <h1>旅行先は上高地と<br>岐阜県・乗鞍畳平です!</h1>
        <p>一緒にきれいな景色見に行こうね</p>
        <a href="/plan"><button>旅のしおりを見る</button></a>
    </div>

    <div th:unless="${isCorrect}">
        <div class="label">Try Again</div>
        <h1>残念、また今度!</h1>
        <p>もう一度クイズに挑戦してみてね</p>
        <a href="/quiz"><button>クイズに戻る</button></a>
    </div>
</div>
</body>
</html>
