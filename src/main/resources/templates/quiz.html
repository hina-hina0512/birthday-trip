<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お誕生日クイズ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-color: #fafaf8;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .label {
            font-family: 'EB Garamond', serif;
            font-size: 1.0em;
            letter-spacing: 0.2em;
            color: #f4d288;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.5em;
            font-weight: 600;
            color: #0b0909;
            margin-bottom: 12px;
            letter-spacing: 0.03em;
        }

        p {
            font-size: 0.9em;
            color: #919090;
            line-height: 1.8;
            margin-bottom: 36px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        a {
            font-family: 'HGS教科書体' ;
            text-decoration: none;
        }

        button {
            width: 100%;
            font-family: 'Noto Serif JP', serif;
            font-weight: 500;
            font-size: 0.9em;
            letter-spacing: 0.05em;
            padding: 16px 24px;
            background-color: #fff;
            color: #333;
            border: 1px solid #e0dcd4;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #2c2c2c;
            color: #fff;
            border-color: #2c2c2c;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="label">Quiz.1</div>
    <h1>旅の行き先はどこでしょう？</h1>
    <p>下の選択肢から選んでね</p>

    <div class="choices">
        <a href="/trivia1?q1=gifu"><button>岐阜県</button></a>
        <a href="/trivia10-p34e?q1=niigata"><button>新潟県</button></a>
        <a href="/trivia1?q1=aomori"><button>青森県</button></a>
        <a href="/trivia1?q1=fukushima"><button>福島県</button></a>
    </div>
</div>
</body>
</html>
