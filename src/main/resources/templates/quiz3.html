<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヒントクイズ3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-color: #fafaf8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .label {
            font-family: 'EB Garamond', serif;
            font-size: 0.75em;
            letter-spacing: 0.2em;
            color: #b8a488;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.2em;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 8px;
            line-height: 1.7;
        }

        p.sub {
            font-family: 'Noto Serif JP', serif;
            font-size: 0.85em;
            color: #999;
            margin-bottom: 32px;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        a {
            text-decoration: none;
        }

        .card {
            display: block;
            border: 1px solid #e0dcd4;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #2c2c2c;
        }

        .card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }

        .card span {
            display: block;
            padding: 10px;
            font-size: 0.85em;
            color: #333;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="label">Quiz 3</div>
    <h1>上高地から車で進んだ先にある、<br>日本一標高の高いバスターミナル「乗鞍畳平」。<br>その標高は、次のうちどれとだいたい同じ?</h1>
    <p class="sub">標高 約2,700m</p>

    <div class="choices">
        <a th:href="@{/trivia3(q1=${param.q1}, q2=${param.q2}, q3='fuji5')}">
            <div class="card">
                <img src="/images/fuji5.jpg" alt="富士山の五合目">
                <span>富士山の五合目</span>
            </div>
        </a>
        <a th:href="@{/trivia3(q1=${param.q1}, q2=${param.q2}, q3='tokyotower')}">
            <div class="card">
                <img src="/images/tokyotower.jpg" alt="東京タワーの高さ">
                <span>東京タワーの高さ</span>
            </div>
        </a>
        <a th:href="@{/trivia3(q1=${param.q1}, q2=${param.q2}, q3='harukas')}">
            <div class="card">
                <img src="/images/harukas.jpg" alt="あべのハルカスの高さ">
                <span>あべのハルカスの高さ</span>
            </div>
        </a>
        <a th:href="@{/trivia3(q1=${param.q1}, q2=${param.q2}, q3='kurobe')}">
            <div class="card">
                <img src="/images/kurobe.jpg" alt="黒部ダムの高さ">
                <span>黒部ダムの高さ</span>
            </div>
        </a>
    </div>
</div>
</body>
</html>
